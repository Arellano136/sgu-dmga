name: sgu-dmga-10c

services:
  database:
    image: mysql:8
    container_name: sgu-database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
    ports:
      - "3307:3306"
    networks:
      - sgu-net
    volumes:
      - sgu-volume:/var/lib/mysql

  frontend:
    image: client:1.0-sgu
    build:
      context: ./client
      args:
        API_HOST: localhost
        API_PORT: 8081
        API_BASE: /sgu-api
        API_PROTOCOL: https
    container_name: sgu-frontend
    ports:      
      - "3080:80"
      - "3000:443"
    networks: 
      - sgu-net
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - database

  backend:
    container_name: sgu-backend
    image: server:1.0-sgu
    build:
      context: ./service
    environment:
      SERVER_PORT: 8081
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: userdb
      DB_USER: root
      DB_PASS: root
      SERVER_SSL_ENABLE: true
      SERVER_SSL_KEYSTORE: /etc/letsencrypt/live/localhost/keystore.p12
      SERVER_SSL_KEYSTORE_PASS: changeit
    ports:
      - "8081:8081"
    networks:
      - sgu-net
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - frontend

networks:
  sgu-net:
    driver: bridge

volumes:
  sgu-volume:
    driver: local
  certbot-conf:
    external: true